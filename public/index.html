<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRoom — BML Munjal University Day Scholar Portal</title>
  
  <!-- Browser Favicon & Touch Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="blueprint-bg">

<div id="appRoot">
  <header class="site-header">
    <div class="header-content">
      <a class="brand-link" data-route="#/">
        <!-- Scalable Production Blueprint Logo -->
        <svg class="brand-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="#131D35"/>
          <rect x="10" y="10" width="28" height="28" rx="6" stroke="#118A5E" stroke-width="2.5" stroke-dasharray="4 2"/>
          <path d="M18 30V18L26 22V34L18 30Z" fill="#118A5E"/>
          <circle cx="32" cy="18" r="3" fill="#DC9222"/>
        </svg>
        <span>OpenRoom</span>
        <span style="font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); font-weight:400; margin-left:2px;">BMU</span>
      </a>
      <nav class="main-nav" id="navBar"></nav>
    </div>
  </header>

  <main id="viewPort"></main>

  <footer style="border-top:1px solid var(--line); background:#ffffff; padding:24px; text-align:center; font-size:13px; color:var(--ink-soft); margin-top:auto;">
    <p>OpenRoom &bull; BML Munjal University Day Scholar Campus Life &amp; Empty Classroom Finder.</p>
  </footer>
</div>

<!-- Floating Campus AI Chatbot Widget -->
<div id="aiChatWidget" style="position:fixed; bottom:24px; right:24px; z-index:99999;">
  <button id="btnToggleChat" onclick="toggleCampusChat()" style="width:54px; height:54px; border-radius:50%; background:#131D35; color:#ffffff; border:none; box-shadow:0 6px 20px rgba(0,0,0,0.3); cursor:pointer; font-size:24px; display:flex; align-items:center; justify-content:center; transition:transform 0.2s;" title="Open Campus AI Assistant">
    🤖
  </button>
  
  <div id="aiChatPanel" style="display:none; position:absolute; bottom:68px; right:0; width:360px; height:480px; background:#ffffff; border-radius:14px; box-shadow:0 12px 35px rgba(0,0,0,0.22); border:1px solid #CBD5E1; flex-direction:column; overflow:hidden;">
    <div style="background:#131D35; color:#ffffff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px;">
        <span>🤖</span> OpenRoom Campus AI
      </div>
      <button onclick="toggleCampusChat(false)" style="background:none; border:none; color:#ffffff; font-size:16px; cursor:pointer; padding:4px 8px;">✕</button>
    </div>
    
    <div id="aiChatLog" style="flex:1; padding:14px; overflow-y:auto; font-size:13px; display:flex; flex-direction:column; gap:10px; background:#F8FAFC;">
      <div style="background:#ffffff; border:1px solid #E2E8F0; padding:10px 12px; border-radius:8px; line-height:1.4;">
        👋 Hi! I can help you find empty study rooms, identify upcoming class slots, and check occupancy across E-2, Gateway, Library, and Innovation Hub. What are you looking for?
      </div>
    </div>
    
    <form id="aiChatForm" onsubmit="sendCampusChatMessage(event)" style="display:flex; border-top:1px solid #E2E8F0; padding:10px; background:#ffffff; gap:6px;">
      <input type="text" id="aiChatInput" placeholder="Ask about free rooms..." required style="flex:1; padding:8px 12px; border:1px solid #CBD5E1; border-radius:6px; font-size:13px; outline:none;">
      <button type="submit" class="btn btn-primary" style="padding:8px 14px; font-size:13px; border-radius:6px; background:#118A5E; color:#fff; border:none; cursor:pointer;">Send</button>
    </form>
  </div>
</div>

<div id="toastHost"></div>

<script src="/js/app.js"></script>
</body>
</html>
